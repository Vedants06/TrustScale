scenario_id: byzantine_20pct
name: 20 Percent Byzantine Attack
description: >
  Two out of eight nodes (20%) simultaneously act as under-reporters.
  Tests TrustScale's ability to detect multiple Byzantine nodes
  in a scaled cluster.

total_nodes: 8
target_nodes:
  - node_id: node_1
    behavior: under_reporter
    intensity: 0.8
    start_at_seconds: 15
    duration_seconds: 240

  - node_id: node_5
    behavior: under_reporter
    intensity: 0.8
    start_at_seconds: 15
    duration_seconds: 240

traffic_pattern: steady_state
scenario_duration_seconds: 270
defense_enabled: true
random_seed: 2001