  - node_id: node_2
    behavior: colluder
    intensity: 0.7
    start_at_seconds: 15
    duration_seconds: 240

  - node_id: node_4
    behavior: colluder
    intensity: 0.7
    start_at_seconds: 15
    duration_seconds: 240

  - node_id: node_6
    behavior: colluder
    intensity: 0.7
    start_at_seconds: 15
    duration_seconds: 240

traffic_pattern: steady_state
scenario_duration_seconds: 270
defense_enabled: true
random_seed: 3001