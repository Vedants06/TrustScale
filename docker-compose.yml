services:
  redis:
    image: redis:7-alpine
    container_name: trustscale-redis
    ports:
      - "6379:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - trustscale-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  load_balancer:
    build:
      context: .
      dockerfile: services/load_balancer/Dockerfile
    container_name: trustscale-lb
    ports:
      - "8000:8000"
    environment:
      - LB_PORT=8000
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trustscale-network

  node_1:
    build:
      context: .
      dockerfile: services/node/Dockerfile
    container_name: trustscale-node-1
    ports:
      - "8001:8001"
    environment:
      - NODE_ID=node_1
      - NODE_PORT=8001
      - LB_URL=http://load_balancer:8000
      - BEHAVIOR_MODE=honest
      - REPORT_INTERVAL_SECONDS=5
      - LOG_LEVEL=INFO
    depends_on:
      - load_balancer
    networks:
      - trustscale-network

  node_2:
    build:
      context: .
      dockerfile: services/node/Dockerfile
    container_name: trustscale-node-2
    ports:
      - "8002:8001"
    environment:
      - NODE_ID=node_2
      - NODE_PORT=8001
      - LB_URL=http://load_balancer:8000
      - BEHAVIOR_MODE=honest
      - REPORT_INTERVAL_SECONDS=5
      - LOG_LEVEL=INFO
    depends_on:
      - load_balancer
    networks:
      - trustscale-network

  node_3:
    build:
      context: .
      dockerfile: services/node/Dockerfile
    container_name: trustscale-node-3
    ports:
      - "8003:8001"
    environment:
      - NODE_ID=node_3
      - NODE_PORT=8001
      - LB_URL=http://load_balancer:8000
      - BEHAVIOR_MODE=honest
      - REPORT_INTERVAL_SECONDS=5
      - LOG_LEVEL=INFO
    depends_on:
      - load_balancer
    networks:
      - trustscale-network

  traffic_generator:
    build:
      context: .
      dockerfile: services/traffic_generator/Dockerfile
    container_name: trustscale-traffic
    ports:
      - "8089:8089"
    environment:
      - TARGET_URL=http://load_balancer:8000
      - TRAFFIC_PATTERN=steady_state
      - STEADY_STATE_USERS=10
      - STEADY_STATE_SPAWN_RATE=2
      - STEADY_STATE_DURATION_SECONDS=300
      - MORNING_RAMP_START_USERS=1
      - MORNING_RAMP_TARGET_USERS=20
      - MORNING_RAMP_SPAWN_RATE=2
      - MORNING_RAMP_DURATION_SECONDS=180
      - MORNING_RAMP_HOLD_SECONDS=120
    depends_on:
      - load_balancer
    networks:
      - trustscale-network

networks:
  trustscale-network:
    driver: bridge

volumes:
  redis-data: