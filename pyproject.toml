[tool.poetry]
package-mode = false
name = "trustscale"
version = "0.1.0"
description = "load balancer"
authors = ["TrustScale Authors"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.13.*"
pydantic = "^2.13.4"
cryptography = "^49.0.0"
pyjwt = "^2.13.0"
structlog = "^26.1.0"
pydantic-settings = "^2.14.2"
locust = "^2.46.2"
fastapi = "^0.140.7"
uvicorn = "^0.51.0"
aiohttp = "^3.14.3"
redis = "^8.0.1"
psutil = "^7.2.2"
pyyaml = "^6.0.3"
prometheus-client = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
