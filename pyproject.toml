[tool.poetry]
package-mode = false
name = "trustscale"
version = "0.1.0"
description = "load balancer"
authors = ["TrustScale Authors"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.13.*"
pydantic = "^2.13.4"
cryptography = "^49.0.0"
pyjwt = "^2.13.0"
structlog = "^26.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "ruff (>=0.16.0,<0.17.0)"
]
